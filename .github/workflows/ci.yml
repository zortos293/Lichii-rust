name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  ffmpeg-windows:
    uses: ./.github/workflows/ffmpeg-windows.yml

  check:
    needs: ffmpeg-windows
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          libavcodec=$(apt-cache pkgnames libavcodec | grep -E '^libavcodec[0-9]+(t64)?$' | sort -V | tail -1)
          sudo apt-get install -y libvulkan-dev mesa-vulkan-drivers libudev-dev libasound2-dev "$libavcodec" libxkbcommon-dev libwayland-dev spirv-tools vulkan-validationlayers
          echo LICHII_REQUIRE_VALIDATION=1 >> "$GITHUB_ENV"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Fetch FFmpeg
        if: runner.os == 'Windows'
        uses: actions/download-artifact@v4
        with:
          name: ffmpeg-windows
          path: ffmpeg
      - run: cargo test --workspace
        env:
          LICHII_REQUIRE_FFMPEG: 1
          LICHII_FFMPEG_DIR: ${{ github.workspace }}/ffmpeg
      - name: Show the Vulkan validation layer is active
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo test --workspace --test foundation selects_devices_by_name_and_falls_back -- --nocapture 2>&1 | tee /dev/stderr | grep 'validation layers: true'
