name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  ffmpeg-windows:
    uses: ./.github/workflows/ffmpeg-windows.yml

  check:
    needs: ffmpeg-windows
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libvulkan-dev mesa-vulkan-drivers libudev-dev libasound2-dev libavcodec60 libxkbcommon-dev libwayland-dev spirv-tools
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Fetch FFmpeg
        if: runner.os == 'Windows'
        uses: actions/download-artifact@v4
        with:
          name: ffmpeg-windows
          path: ffmpeg
      - run: cargo test --workspace
        env:
          LICHII_REQUIRE_FFMPEG: 1
          LICHII_FFMPEG_DIR: ${{ github.workspace }}/ffmpeg
