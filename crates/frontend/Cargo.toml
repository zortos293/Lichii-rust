[package]
name = "lichii"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "lichii"
path = "src/main.rs"

[dependencies]
lichii-common.workspace = true
lichii-core.workspace = true
lichii-input.workspace = true
lichii-vulkan.workspace = true
crossbeam-channel.workspace = true
egui = { workspace = true, features = ["default_fonts"] }
egui-winit = "0.37"
egui-wgpu = { version = "0.37", default-features = false }
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "vulkan", "wgsl"] }
pollster = "0.4"
rfd = "0.18"
tracing.workspace = true
winit.workspace = true
